name: Submit URLs to Baidu

on:
  schedule:
    # 每天 UTC 时间 0:00 运行（北京时间 8:00）
    - cron: '0 0 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Load previous submission records
        uses: actions/cache@v4
        with:
          path: .baidu_submit_records.json
          key: ${{ runner.os }}-baidu-records-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-baidu-records-
      
      - name: Run submit script
        run: |
          python submit_to_baidu.py --auto
        env:
          PYTHONIOENCODING: utf-8
      
      - name: Commit and push submission records
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: auto-update baidu submission records'
          file_pattern: '.baidu_submit_records.json'
          branch: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
