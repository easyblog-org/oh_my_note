name: Sync Articles to MongoDB

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test MongoDB Connection
        id: test_mongo
        run: |
          echo "🔍 Testing MongoDB connection..."
          node -e "
          const { MongoClient } = require('mongodb');
          
          async function test() {
            const client = new MongoClient(process.env.MONGODB_URI, {
              serverSelectionTimeoutMS: 10000,
              connectTimeoutMS: 10000
            });
            
            try {
              await client.connect();
              await client.db(process.env.MONGODB_DB_NAME || 'oh_my_note').command({ ping: 1 });
              console.log('✅ MongoDB connection successful');
              process.exit(0);
            } catch (error) {
              console.error('❌ MongoDB connection failed:', error.message);
              process.exit(1);
            } finally {
              await client.close();
            }
          }
          
          test();
          "
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME || 'oh_my_note' }}
        continue-on-error: false

      - name: Run Sync Script
        if: success()
        run: npm run sync
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME || 'oh_my_note' }}
          MONGODB_COLLECTION: ${{ secrets.MONGODB_COLLECTION || 'articles' }}
          CLEANUP_ORPHANED: ${{ secrets.CLEANUP_ORPHANED || 'false' }}

      - name: Summary
        if: always()
        run: |
          echo "## Sync Result" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Articles synced successfully to MongoDB" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Sync failed - check logs for details" >> $GITHUB_STEP_SUMMARY
          fi
